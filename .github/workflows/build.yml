name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate Kernel Headers
        run: |
          echo "Searching for OSK.h..."
          # Search the entire SDK for the specific kernel header
          SDK_PATH=$(xcrun --show-sdk-path)
          HEADER_PATH=$(find $SDK_PATH -name "OSK.h" | head -n 1)
          
          if [ -z "$HEADER_PATH" ]; then
            echo "Error: Could not find OSK.h in SDK"
            exit 1
          fi
          
          # Extract the directory part of the path
          INCLUDE_DIR=$(dirname "$HEADER_PATH")
          echo "FOUND_INCLUDE_DIR=$INCLUDE_DIR" >> $GITHUB_ENV
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # We add the explicitly found INCLUDE_DIR and the standard SDK root
          clang++ -target arm64-apple-macosx \
            -isysroot $SDK_PATH \
            -I$FOUND_INCLUDE_DIR \
            -I./KunzitePMIC \
            -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          ld -o build/KunzitePMIC.kext build/KunzitePMIC.o -L$SDK_PATH/usr/lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
