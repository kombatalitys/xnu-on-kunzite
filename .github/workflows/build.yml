name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # We use the local headers directory to satisfy the compiler.
          # -Iheaders adds the root of our local headers.
          # -fno-exceptions and -fno-rtti are mandatory for XNU kernel code.
          
          clang++ -target arm64-apple-macosx \
            -I./headers \
            -I./KunzitePMIC \
            -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          # Linking the object file into a binary.
          # Since we are providing our own headers, we link against the basic system libs
          # to produce the object file, which will be loaded as a kext.
          ld -o build/KunzitePMIC.kext build/KunzitePMIC.o

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
