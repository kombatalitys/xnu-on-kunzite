name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # Compile the driver logic
          clang++ -target arm64-apple-macosx \
            -I./headers \
            -I./KunzitePMIC \
            -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          # Compile the stubs to resolve missing symbols
          clang++ -target arm64-apple-macosx \
            -I./headers \
            -fno-exceptions -fno-rtti -O2 \
            -c stubs.cpp -o build/stubs.o
          
          # Link both object files into the final kext binary
          ld -o build/KunzitePMIC.kext build/KunzitePMIC.o build/stubs.o

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
