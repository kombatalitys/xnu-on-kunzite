name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Toolchain
        run: |
          echo "Configuring XNU Build Environment..."
          # Get the SDK path dynamically
          SDK_PATH=$(xcrun --show-sdk-path)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          xcode-select -p

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # We must point to the SDK's kernel headers.
          # For XNU drivers, we typically need the SDK's include directory.
          # We use -isysroot to tell clang where the system root is.
          
          clang++ -target arm64-apple-macosx \
            -isysroot $SDK_PATH \
            -I./KunzitePMIC \
            -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          # Linking the object file into a kernel extension binary
          ld -o build/KunzitePMIC.kext build/KunzitePMIC.o -L$SDK_PATH/usr/lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
