name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # We point the compiler to the ROOT of our local include directory.
          # Because our headers are at include/sys/systm.h, include/libkern/OSK.h, etc.,
          # adding -I$GITHUB_WORKSPACE/include allows the compiler to resolve 
          # #include "sys/systm.h" and #include "libkern/OSK.h" perfectly.
          
          clang++ -target arm64-apple-macosx \
            -I"$GITHUB_WORKSPACE/include" \
            -I"$GITHUB_WORKSPACE/KunzitePMIC" \
            -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          # Compile the stubs
          clang++ -target arm64-apple-macosx \
            -I"$GITHUB_WORKSPACE/include" \
            -fno-exceptions -fno-rtti -O2 \
            -c stubs.cpp -o build/stubs.o
          
          # Link the final kext binary
          ld -o build/KunzitePMIC.kext build/KunzitePMIC.o build/stubs.o

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
