name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # Using absolute path via GITHUB_WORKSPACE to eliminate all ambiguity
          # We point directly to the 'include' folder where OSK.h and IOService.h live
          clang++ -target arm64-apple-macosx \
            -I"$GITHUB_WORKSPACE/include" \
            -I"$GITHUB_WORKSPACE/KunzitePMIC" \
            -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          # Compile the stubs
          clang++ -target arm64-apple-macosx \
            -I"$GITHUB_WORKSPACE/include" \
            -fno-exceptions -fno-rtti -O2 \
            -c stubs.cpp -o build/stubs.o
          
          # Link the final kext binary
          ld -o build/KunzitePMIC.kext build/KunzitePMIC.o build/stubs.o

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
