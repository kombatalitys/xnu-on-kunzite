name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # We use -ffreestanding and -nostdlib to tell the compiler 
          # that we are building a kernel object, not a standard app.
          # This removes the implicit dependency on 'main' and libc.
          
          clang++ -target arm64-apple-macosx \
            -I"$GITHUB_WORKSPACE/include" \
            -I"$GITHUB_WORKSPACE/KunzitePMIC" \
            -ffreestanding -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          # Compile the stubs with the same freestanding flags
          clang++ -target arm64-apple-macosx \
            -I"$GITHUB_WORKSPACE/include" \
            -ffreestanding -fno-exceptions -fno-rtti -O2 \
            -c stubs.cpp -o build/stubs.o
          
          # We use -r (relocatable) to prevent the linker from looking for 'main'
          # This creates a kernel-compatible object binary.
          ld -r -o build/KunzitePMIC.kext build/KunzitePMIC.o build/stubs.o

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
