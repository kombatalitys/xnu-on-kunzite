name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Drivers
        run: |
          mkdir -p build
          
          # Compiler flags for XNU freestanding kernel extensions
          FLAGS="-target arm64-apple-macosx -I$GITHUB_WORKSPACE/include -fno-exceptions -fno-rtti -O2"
          
          # 1. Compile PMIC Driver
          clang++ $FLAGS -I$GITHUB_WORKSPACE/KunzitePMIC -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          # 2. Compile Haptics Driver
          clang++ $FLAGS -I$GITHUB_WORKSPACE/KunziteHaptics -c KunziteHaptics/KunziteHaptics.cpp -o build/KunziteHaptics.o
          
          # 3. Compile Display Driver
          clang++ $FLAGS -I$GITHUB_WORKSPACE/KunziteDisplay -c KunziteDisplay/KunziteDisplay.cpp -o build/KunziteDisplay.o
          
          # 4. Compile the stubs
          clang++ $FLAGS -c stubs.cpp -o build/stubs.o
          
          # Link all object files into a single relocatable kext binary
          ld -r -o build/KunziteDrivers.kext build/KunzitePMIC.o build/KunziteHaptics.o build/KunziteDisplay.o build/stubs.o

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
