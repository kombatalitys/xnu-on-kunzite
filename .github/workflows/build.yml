name: Build XNU Driver

on:
  push:
    branches: [ master, main ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile KunzitePMIC Driver
        run: |
          mkdir -p build
          
          # Explicitly add all header subdirectories to the include path
          # This ensures the compiler finds OSK.h, IOService.h, and systm.h
          clang++ -target arm64-apple-macosx \
            -I./headers \
            -I./headers/libkern \
            -I./headers/IOKit \
            -I./headers/sys \
            -I./KunzitePMIC \
            -fno-exceptions -fno-rtti -O2 \
            -c KunzitePMIC/KunzitePMIC.cpp -o build/KunzitePMIC.o
          
          ld -o build/KunzitePMIC.kext build/KunzitePMIC.o

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-drivers
          path: build/*.kext
